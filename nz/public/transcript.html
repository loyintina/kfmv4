<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>会话记录回看器</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:#0d0e11;color:#d8dade;font:14px/1.65 -apple-system,'PingFang SC',sans-serif;margin:0;padding:0 0 90px}
header{position:sticky;top:0;z-index:9;background:#0d0e11f2;border-bottom:1px solid #26272b;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{background:#16171b;color:#d8dade;border:1px solid #33343a;border-radius:8px;padding:6px 8px;font-size:13px}
select{max-width:46vw}
input#q{flex:1;min-width:120px}
#stat{font-size:11px;color:#7a7d84;width:100%}
.msg{margin:12px 10px;padding:10px 12px;border-radius:10px;border:1px solid #26272b}
.user{background:#141a26;border-color:#2a3a5c}
.assistant{background:#121316}
.meta{font-size:11px;color:#7a7d84;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.user .meta{color:#7d9fd4}
.who{font-weight:600}
.text{white-space:pre-wrap;word-break:break-word}
details.think{margin:4px 0 2px;border:1px dashed #33343a;border-radius:8px;padding:4px 8px}
details.think summary{font-size:12px;color:#9a7dd4;cursor:pointer;user-select:none}
details.think .tbody{white-space:pre-wrap;font-size:12px;color:#a9a3c0;max-height:40vh;overflow:auto;margin-top:4px}
.chip{display:inline-block;font-size:11px;background:#1c1d21;border:1px solid #33343a;border-radius:6px;padding:2px 8px;margin:6px 4px 0 0;color:#9a9da3;cursor:pointer;user-select:none}
.chip:active{background:#26272b}
.tcard{margin-top:6px;border:1px solid #33343a;border-radius:8px;background:#0f1013;padding:6px 8px;font-size:12px}
.tcard .lbl{color:#7a7d84;font-size:11px;margin:4px 0 2px}
.tcard .pre{white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto;background:#131418;border-radius:6px;padding:4px 6px}
mark{background:#5c4a1e;color:#ffd479;border-radius:3px;padding:0 2px}
.hide{display:none}
#bottomBtn{position:fixed;bottom:14px;right:12px;background:#0d0e11e6;border:1px solid #33343a;color:#8ab4ff;border-radius:20px;padding:6px 14px;font-size:13px;display:none}
#err{color:#e07b7b;font-size:12px;padding:6px 10px}
</style>
</head>
<body>
<header>
  <select id="sess"></select>
  <input id="q" type="search" placeholder="搜索正文/工具（清空=恢复）">
  <div id="stat">载入中…</div>
  <div id="err"></div>
</header>
<main id="feed"></main>
<button id="bottomBtn">↓ 回到底部</button>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const feed = $('feed'), sess = $('sess'), q = $('q'), stat = $('stat'), err = $('err'), bottomBtn = $('bottomBtn');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fmtTime = (ms) => { if (!ms) return ''; const d = new Date(ms);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const bySeq = new Map();          // seq → {el, msg}
  const expanded = new Set();       // `${seq}:${idx}` 工具卡展开态（重渲染保活）
  let cursor = 0, after = 0, key = localStorage.getItem('transcriptKey') || '', total = 0, nearBottom = true;

  const hl = (text, kw) => kw
    ? esc(text).replace(new RegExp(esc(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`)
    : esc(text);

  const render = (msg, el) => {
    const kw = q.value.trim();
    const think = msg.think
      ? `<details class="think"${expanded.has(msg.seq + ':think') ? ' open' : ''}><summary>思考过程（${msg.think.length} 字）</summary><div class="tbody">${hl(msg.think, kw)}</div></details>`
      : '';
    const cards = (msg.calls || []).map((c, i) => {
      const open = expanded.has(msg.seq + ':' + i);
      const body = open
        ? `<div class="tcard"><div class="lbl">调用参数</div><div class="pre">${hl(c.args || '（无）', kw)}</div>`
          + `<div class="lbl">结果</div><div class="pre">${hl(c.result || '（未回场/进行中）', kw)}</div></div>`
        : '';
      return `<span class="chip" data-idx="${i}">🔧 ${esc(c.name)}${c.result ? '' : ' ⏳'}${open ? ' ▾' : ''}</span>${body}`;
    }).join('');
    el.innerHTML = `<div class="meta"><span class="who">#${msg.seq} ${msg.kind === 'user' ? '用户' : '我'}</span><span>${fmtTime(msg.time)}</span></div>`
      + think
      + `<div class="text">${hl(msg.text, kw)}</div>`
      + cards;
    el.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const i = chip.dataset.idx;
        const k = msg.seq + ':' + i;
        expanded.has(k) ? expanded.delete(k) : expanded.add(k);
        render(msg, el);
      });
    });
    const th = el.querySelector('details.think');
    if (th) th.addEventListener('toggle', () => {
      th.open ? expanded.add(msg.seq + ':think') : expanded.delete(msg.seq + ':think');
    });
  };

  const applyFilter = () => {
    const kw = q.value.trim().toLowerCase();
    let shown = 0;
    for (const { el, msg } of bySeq.values()) {
      const hay = (msg.text + ' ' + msg.tools.join(' ') + ' ' + (msg.think || '') + ' ' + (msg.calls || []).map((c) => c.name + ' ' + c.args + ' ' + c.result).join(' ')).toLowerCase();
      const hit = !kw || hay.includes(kw);
      el.classList.toggle('hide', !hit);
      if (hit) { shown++; render(msg, el); }
    }
    return { kw, shown };
  };
  const paint = (msg) => {
    let rec = bySeq.get(msg.seq);
    if (rec) { rec.msg = msg; render(msg, rec.el); return rec.el; }
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.kind === 'user' ? 'user' : 'assistant');
    feed.appendChild(el);
    render(msg, el);
    bySeq.set(msg.seq, { el, msg });
    return el;
  };
  const toBottom = () => { window.scrollTo(0, document.body.scrollHeight); };
  window.addEventListener('scroll', () => {
    nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
    bottomBtn.style.display = nearBottom ? 'none' : 'block';
  });
  bottomBtn.addEventListener('click', toBottom);

  const load = async (first) => {
    try {
      const url = first
        ? `/api/transcript/messages?key=${encodeURIComponent(key)}&tail=300`
        : `/api/transcript/messages?key=${encodeURIComponent(key)}&since=${cursor}&after=${after}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      cursor = d.cursor; total = d.total; after = d.now || after;
      let last = null;
      for (const m of d.messages) last = paint(m);
      const { kw, shown } = applyFilter();
      stat.textContent = `#${total} 条 · 游标 ${cursor}` + (kw ? ` · 搜索命中 ${shown}` : '');
      if (first || (nearBottom && last)) toBottom();
      err.textContent = '';
    } catch (e) { err.textContent = '拉取失败：' + e.message + '（3s 后重试）'; }
  };
  const fillSessions = async () => {
    const r = await fetch('/api/transcript/sessions');
    const d = await r.json();
    sess.innerHTML = '';
    for (const s of d.sessions) {
      const o = document.createElement('option');
      o.value = s.key;
      const dt = new Date(s.mtime);
      o.textContent = `${s.key.split('/')[1].replace('session_', '')} · ${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')} · ${Math.round(s.size / 1048576)}MB`;
      sess.appendChild(o);
    }
    if (key && d.sessions.some((s) => s.key === key)) sess.value = key;
    key = sess.value;
    localStorage.setItem('transcriptKey', key);
  };
  sess.addEventListener('change', () => {
    key = sess.value;
    localStorage.setItem('transcriptKey', key);
    cursor = 0; after = 0; bySeq.clear(); feed.innerHTML = '';
    load(true);
  });
  let searchTimer;
  q.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilter, 200); });
  fillSessions().then(() => load(true)).then(() => setInterval(() => load(false), 3000));
})();
</script>
</body>
</html>
