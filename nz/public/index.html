<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>kfm-nz</title>
  <style>
    /* 终端字体 = NA 同款（2026-08-26 用户拍板，nz-font-adapt-review）：
       NaMain=用户商业主字体（ASCII/Latin；私有授权勿提交，BUILD 时从
       kfm-na/assets/fonts 拷入）；NaCJK=FusionPixelMono12-gb2312
       （GB2312 子集+终端符号补丁+合成 powerline 实心三角，SIL OFL），
       兜 CJK/盲文/方块/E0B0——商业美术字体天然缺终端符号，逐字
       fallback 路由给它（kfm-na assets/fonts/README 同款分工）。
       顺带治真机 ranger 中文行上移（系统 CJK fallback 基线/光栅化差）。 */
    @font-face {
      font-family: 'NaMain';
      src: url('./fonts/na-main.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'NaCJK';
      src: url('./fonts/na-cjk.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    body { margin: 0; background: #101014; color: #d8d8e0; font-family: monospace; }
    #boot-panel { padding: 24px; }
    /* 8.8.3：刷新即全屏终端——开屏日志默认不挡门，URL 带 ?debug 才显示 */
    .nz-term-first #boot-panel { display: none; }
    h1 { font-size: 16px; color: #8ab4f8; }
    pre { white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
    /* 深蓝意志开屏（预览态：默认休眠，?splash 或 __kfmNzSplash(true) 唤醒；
       转正后改为开机自启+first-frame 淡出——用户拍板前不挡门） */
    #nz-splash {
      position: fixed; inset: 0; background: #05070f; z-index: 90;
      display: none; align-items: center; justify-content: center;
      transition: opacity .3s ease; cursor: pointer;
    }
    #nz-splash.on { display: flex; }
    #nz-splash.out { opacity: 0; pointer-events: none; }
    #nz-splash pre {
      margin: 0; font-family: monospace; font-size: 18px; line-height: 20px;
      white-space: pre; user-select: none; text-align: center;
    }
    #nz-splash .st-cyan { color: #56b6f0; animation: nzPulse 1.6s ease-in-out infinite; }
    @keyframes nzPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
  <script>
    // 首屏前判定（bundle 加载前生效，杜绝日志闪帧）：无 ?debug 即终端优先
    if (!/[?&]debug([=&]|$)/.test(location.search)) {
      document.documentElement.classList.add('nz-term-first');
    }
  </script>
</head>
<body>
  <div id="boot-panel">
    <h1>kfm-nz · Cordis 根总线骨架</h1>
    <pre id="boot-log">加载中…</pre>
  </div>
  <div id="nz-splash"><pre id="nz-splash-art"><span class="st-cyan">    █
   █ █
  █   █
 █     █
█   █   █
 █     █
  █   █
   █ █
    █</span></pre></div>
  <script>
  (function () {
    // ===== 深蓝意志开屏 v6（预览态，与 splash-demo.html 同源）=====
    // 休眠默认；唤醒=?splash 参数 / __kfmNzSplash(true)（CDP evaluate 用，
    // 不导航不杀终端会话）。v6 拍板：单线细环一行一块+宽度随机字形+
    // 紫蓝 8-邻接硬隔离+整段缺口+外向碎块；唯一动效=瞳心向外亮度波。
    var TICK = 42, WAVE_MS = 2400, STEPS = 8;
    var ZONES = { pupil: [96, 165, 250], inner: [139, 92, 246], outer: [59, 130, 246] };
    var seed = 20260828 >>> 0;
    function R() {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    var GLYPHS = ['█', '█', '█', '█', '▉', '▉', '▊', '▊', '▋', '▌', '▍'];
    function pickGlyph() { return GLYPHS[Math.floor(R() * GLYPHS.length)]; }
    var EW = 19, EH = 27, ECX = 9, ECY = 13;
    var emblem = null;
    function build() {
      emblem = [];
      for (var y0 = 0; y0 < EH; y0++) emblem.push(new Array(EW).fill(null));
      mark(ECX, ECY, 'pupil');                       // 竖瞳：孤单一格
      drawRing(ECX, ECY, 3, 7, 'inner');             // 内圈紫环
      drawRing(ECX, ECY, 8, 13, 'outer');            // 外圈蓝环
    }
    function touchesOtherZone(x, y, zone) {
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var n = emblem[y + dy] && emblem[y + dy][x + dx];
        if (n && n.zone !== zone) return true;
      }
      return false;
    }
    function mark(x, y, zone, glyph) {
      if (x < 0 || x >= EW || y < 0 || y >= EH) return;
      if (touchesOtherZone(x, y, zone)) return;      // 紫蓝硬隔离
      emblem[y][x] = { zone: zone, glyph: glyph || '█',
        dist: Math.sqrt((x - ECX) * (x - ECX) + (y - ECY) * (y - ECY)) };
    }
    function drawRing(cx, cy, rx, ry, zone) {
      var gaps = [];
      var ng = 1 + Math.floor(R() * 2);
      for (var g = 0; g < ng; g++) gaps.push([R(), 0.04 + R() * 0.07]);
      var V = [[0, -ry], [rx, 0], [0, ry], [-rx, 0]];
      var steps = Math.ceil(2 * (rx + ry)) * 2;
      var px = null, py = null;
      for (var i = 0; i <= steps; i++) {
        var t = (i / steps) % 1;
        var inGap = false;
        for (var gi = 0; gi < gaps.length; gi++) {
          if (t >= gaps[gi][0] && t <= gaps[gi][0] + gaps[gi][1]) { inGap = true; break; }
        }
        if (inGap) { px = null; continue; }
        var e = Math.floor(t * 4), et = t * 4 - e;
        var vx = V[e][0] + (V[(e + 1) % 4][0] - V[e][0]) * et;
        var vy = V[e][1] + (V[(e + 1) % 4][1] - V[e][1]) * et;
        var x = Math.round(cx + vx), y = Math.round(cy + vy);
        if (px !== null && y === py && Math.abs(x - px) < 2) continue; // 一行最多一块
        mark(x, y, zone, pickGlyph());
        if (R() < 0.04) {                              // 卫星碎块：只朝外漂
          var sx = x === cx ? 0 : (x > cx ? 1 : -1);
          var sy = y === cy ? 0 : (y > cy ? 1 : -1);
          mark(x + sx * (1 + Math.floor(R() * 2)), y + sy * (1 + Math.floor(R() * 2)), zone, pickGlyph());
        }
        px = x; py = y;
      }
    }
    function shade(base, b) {
      var k = 0.30 + 0.70 * b, w = b > 0.8 ? (b - 0.8) * 2.2 : 0;
      var c = [base[0] * k, base[1] * k, base[2] * k];
      return 'rgb(' + Math.round(c[0] + (255 - c[0]) * w) + ',' +
             Math.round(c[1] + (255 - c[1]) * w) + ',' + Math.round(c[2] + (255 - c[2]) * w) + ')';
    }
    var styled = false;
    function ensureStyle() {
      if (styled) return; styled = true;
      var css = [];
      ['pupil', 'inner', 'outer'].forEach(function (zn) {
        for (var s = 0; s < STEPS; s++) {
          css.push('#nz-splash .z-' + zn + '-' + s + '{color:' + shade(ZONES[zn], s / (STEPS - 1)) + '}');
        }
      });
      var st = document.createElement('style');
      st.textContent = css.join('\n');
      document.head.appendChild(st);
    }
    var pre = document.getElementById('nz-splash-art');
    function frame(ms) {
      var phase = (ms % WAVE_MS) / WAVE_MS * Math.PI * 2;
      var lines = [];
      for (var y = 0; y < EH; y++) {
        var html = '', runCls = null, run = '';
        for (var x = 0; x < EW; x++) {
          var cell = emblem[y][x];
          var cls = '', ch = ' ';
          if (cell) {
            var b = 0.5 + 0.5 * Math.sin(phase - cell.dist * 0.45);
            cls = 'z-' + cell.zone + '-' + Math.round(b * (STEPS - 1));
            ch = cell.glyph;
          }
          if (cls !== runCls) {
            if (run) html += runCls ? '<span class="' + runCls + '">' + run + '</span>' : run;
            runCls = cls; run = '';
          }
          run += ch;
        }
        if (run) html += runCls ? '<span class="' + runCls + '">' + run + '</span>' : run;
        lines.push(html);
      }
      pre.innerHTML = lines.join('\n');
    }
    var splash = document.getElementById('nz-splash');
    var t0 = 0, last = 0, dead = false, running = false;
    function tick(now) {
      if (dead || !running) return;
      if (now - last >= TICK) {
        last = now;
        try { frame(now - t0); } catch (e) { dead = true; return; } // 出错停表不清屏
      }
      requestAnimationFrame(tick);
    }
    window.__kfmNzSplash = function (on) {
      if (on) {
        if (!emblem) build();
        ensureStyle();
        splash.classList.remove('out');
        splash.classList.add('on');
        t0 = performance.now(); last = 0; dead = false; running = true;
        requestAnimationFrame(tick);
      } else {
        running = false;
        splash.classList.add('out');
        setTimeout(function () { splash.classList.remove('on'); }, 320);
      }
      return running;
    };
    splash.addEventListener('click', function () { window.__kfmNzSplash(false); });
    if (/[?&]splash([=&]|$)/.test(location.search)) window.__kfmNzSplash(true);
  })();
  </script>
  <script type="module" src="./bundle.js?v=e1553985"></script>
</body>
</html>
