<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
  <title>kfm-nz</title>
  <link rel="stylesheet" href="./tokens.css?v=2890fb29">
  <style>
    /* 终端字体 = NA 同款（2026-08-26 用户拍板，nz-font-adapt-review）：
       NaMain=用户商业主字体（ASCII/Latin；私有授权勿提交，BUILD 时从
       kfm-na/assets/fonts 拷入）；NaCJK=FusionPixelMono12-gb2312
       （GB2312 子集+终端符号补丁+合成 powerline 实心三角，SIL OFL），
       兜 CJK/盲文/方块/E0B0——商业美术字体天然缺终端符号，逐字
       fallback 路由给它（kfm-na assets/fonts/README 同款分工）。
       顺带治真机 ranger 中文行上移（系统 CJK fallback 基线/光栅化差）。 */
    @font-face {
      font-family: 'NaMain';
      src: url('./fonts/na-main.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'NaCJK';
      src: url('./fonts/na-cjk.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    /* body 底色对齐开屏覆层 #05070f（2026-08-30 逐帧实录定罪：#101014
       与覆层两截深色色差=开机序列里多一次肉眼可辨的跳变） */
    /* safe-area 变量单源（2026-08-31 全面屏 edge-to-edge）：壳层
       SHORT_EDGES 铺进刘海区后 env() 吐真值；终端容器 padding 与
       ?debug 遥测（sat/sab）同吃这两个变量，不各量各的。非刘海/非
       edge-to-edge 环境（桌面/headless）=0px，天然无影响。 */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body { margin: 0; background: #05070f; color: #d8d8e0; font-family: monospace; }
    #boot-panel { padding: 24px; }
    /* 8.8.3：刷新即全屏终端——开屏日志默认不挡门，URL 带 ?debug 才显示 */
    .nz-term-first #boot-panel { display: none; }
    h1 { font-size: 16px; color: #8ab4f8; }
    pre { white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
    /* 深蓝意志开屏：样式/DOM/逻辑全部由 splash 插件（src/client/plugins/
       splash）+ 静态资源 splash-core.js 接管（8.8.5，2026-08-30 落地）——
       本页零内联，bundle 挂掉=无覆层不挡门（休眠默认语义不变）。 */
  </style>
  <script>
    // 首屏前判定（bundle 加载前生效，杜绝日志闪帧）：无 ?debug 即终端优先
    if (!/[?&]debug([=&]|$)/.test(location.search)) {
      document.documentElement.classList.add('nz-term-first');
    }
  </script>
</head>
<body>
  <div id="boot-panel">
    <h1>kfm-nz · Cordis 根总线骨架</h1>
    <pre id="boot-log">加载中…</pre>
  </div>
  <script type="module" src="./bundle.js?v=d350c0bb"></script>
</body>
</html>
