<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深蓝意志 · splash demo v8</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  #nz-splash {
    position: fixed; inset: 0; background: #05070f;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .3s ease; cursor: pointer;
  }
  #nz-splash.out { opacity: 0; pointer-events: none; }
  #nz-splash pre {
    margin: 0; font-family: monospace; font-size: 18px; line-height: 20px;
    white-space: pre; user-select: none; text-align: center;
  }
  /* 静态兜底（JS 未跑/挂掉时也有一帧徽标+呼吸动画） */
  #nz-splash .st-cyan { color: #56b6f0; animation: nzPulse 1.6s ease-in-out infinite; }
  @keyframes nzPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div id="nz-splash"><pre id="art"><span class="st-cyan">    █
   █ █
  █   █
 █     █
█   █   █
 █     █
  █   █
   █ █
    █</span></pre></div>
<script>
(function () {
  // ============ 深蓝意志开屏 v8（逐行精确菱形+重心钉线）============
  // 只要一个图标：竖长菱瞳，无文字。三环——竖瞳蓝块/内圈紫环/外圈蓝环。
  // 环块大小、数量、位置刻意不对称（定种子随机：缺块/抖动/步距/字形混杂），
  // 环间距 > 环宽（环 1 格线宽，间距 2 格以上）。唯一动效=瞳心向外亮度波。
  var TICK = 42;
  var WAVE_MS = 2400;
  var STEPS = 8;

  var ZONES = {
    pupil: [96, 165, 250],
    inner: [139, 92, 246],
    outer: [59, 130, 246]
  };

  // ---- 定种子随机（mulberry32：重绘不跳变，乱而确定）----
  var seed = 20260828 >>> 0;
  function R() {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // 字形池+墨迹宽度（v8 重心钉线要用：窄字墨迹靠左贴格，重心不在格心）
  var GLYPHS = ['█', '█', '█', '█', '▉', '▉', '▊', '▊', '▋', '▌', '▍'];
  var GLYPH_W = { '█': 1, '▉': 0.875, '▊': 0.75, '▋': 0.625, '▌': 0.5, '▍': 0.375 };
  function pickGlyph() { return GLYPHS[Math.floor(R() * GLYPHS.length)]; }

  // ---- 竖长网格：19×27（v5 加宽横向），瞳心居中 ----
  var EW = 19, EH = 27, ECX = 9, ECY = 13;
  var emblem = [];
  for (var ey0 = 0; ey0 < EH; ey0++) emblem.push(new Array(EW).fill(null));
  // 硬隔离（用户拍板 v4）：任何块不得与异色块 8-邻接——紫蓝永不相触
  function touchesOtherZone(x, y, zone) {
    for (var dy = -1; dy <= 1; dy++) {
      for (var dx = -1; dx <= 1; dx++) {
        var n = emblem[y + dy] && emblem[y + dy][x + dx];
        if (n && n.zone !== zone) return true;
      }
    }
    return false;
  }
  function mark(x, y, zone, glyph, nudge, fxDist) {
    if (x < 0 || x >= EW || y < 0 || y >= EH) return;
    if (touchesOtherZone(x, y, zone)) return;
    // v8：nudge=墨迹重心到理想线的亚格补偿（渲染 left:Xch）；
    // dist 按理想位置算，亮度波相位与视觉几何一致。
    var fx = (typeof fxDist === 'number') ? fxDist : x;
    emblem[y][x] = { zone: zone, glyph: glyph || '█', nudge: nudge || 0,
      dist: Math.sqrt((fx - ECX) * (fx - ECX) + (y - ECY) * (y - ECY)) };
  }

  // ---- 逐行精确菱形环 v8（2026-08-28 用户三症拍板）----
  // v6/v7 参数步进流的三宗罪：①同行双块（顶点附近折返）②整段缺失
  // （随机缺口+同行跳过叠乘）③窄字重心离线（墨迹靠左贴格，重心
  // 偏左 (1-w)/2）。v8 改按菱形方程逐行精确落块：|X/rx|+|Y/ry|=1，
  // 每行左右缘各一块（尖顶两侧合一），每行都有块、每侧每行至多一块；
  // 重心钉线：墨迹重心=x+nudge+w/2，目标=fx+0.5 → nudge=(fx-x)+(1-w)/2。
  // 随机感只剩宽度随机；卫星碎块/偶发缺行均已除（用户拍板 v8 定稿）——
  // 每行每侧必有一块，满覆盖。
  function placeEdge(fx, y, zone) {
    var glyph = pickGlyph();
    var w = GLYPH_W[glyph];
    var x = Math.round(fx);
    mark(x, y, zone, glyph, (fx - x) + (1 - w) / 2, fx);
  }
  function drawRing(cx, cy, rx, ry, zone) {
    for (var dy = -ry; dy <= ry; dy++) {
      var ex = rx * (1 - Math.abs(dy) / ry);        // 该行边缘距中线（精确解）
      if (ex < 0.5) { placeEdge(cx, cy + dy, zone); continue; } // 尖顶合一
      placeEdge(cx - ex, cy + dy, zone);            // 左缘
      placeEdge(cx + ex, cy + dy, zone);            // 右缘
    }
  }

  // 竖瞳：孤单一格（用户拍板 v4：中央眼睛只一个方块）
  mark(ECX, ECY, 'pupil');
  drawRing(ECX, ECY, 3, 7, 'inner');    // 内圈紫环：与瞳隔 2+ 格
  drawRing(ECX, ECY, 8, 13, 'outer');   // 外圈蓝环：v5 加宽，与紫环隔 5 格

  // ---- 调色：每区 STEPS 档亮度（暗→本色→带白尖），注入 <style> ----
  function shade(base, b) {
    var k = 0.30 + 0.70 * b;
    var w = b > 0.8 ? (b - 0.8) * 2.2 : 0;
    var c = [base[0] * k, base[1] * k, base[2] * k];
    return 'rgb(' + Math.round(c[0] + (255 - c[0]) * w) + ',' +
           Math.round(c[1] + (255 - c[1]) * w) + ',' + Math.round(c[2] + (255 - c[2]) * w) + ')';
  }
  var css = [];
  ['pupil', 'inner', 'outer'].forEach(function (zn) {
    for (var s = 0; s < STEPS; s++) {
      css.push('#nz-splash .z-' + zn + '-' + s + '{color:' + shade(ZONES[zn], s / (STEPS - 1)) + '}');
    }
  });
  var st = document.createElement('style');
  st.textContent = css.join('\n');
  document.head.appendChild(st);

  var pre = document.getElementById('art');

  function frame(ms) {
    var phase = (ms % WAVE_MS) / WAVE_MS * Math.PI * 2;
    var lines = [];
    for (var y = 0; y < EH; y++) {
      var html = '', runCls = null, runGlyph = null, run = '';
      function flush() {
        if (!run) return;
        html += runCls ? '<span class="' + runCls + '">' + run + '</span>' : run;
        run = '';
      }
      for (var x = 0; x < EW; x++) {
        var cell = emblem[y][x];
        if (cell && cell.nudge) {
          // v7 钉线块：独立 span 亚格平移，不进同行合并 run
          flush(); runCls = undefined;
          var nb = 0.5 + 0.5 * Math.sin(phase - cell.dist * 0.45);
          html += '<span class="z-' + cell.zone + '-' + Math.round(nb * (STEPS - 1)) +
                  '" style="position:relative;left:' + cell.nudge.toFixed(2) + 'ch">' +
                  cell.glyph + '</span>';
          continue;
        }
        var cls = '', ch = ' ';
        if (cell) {
          // 唯一动效：亮度波从瞳心(dist=0)向外环传播
          var b = 0.5 + 0.5 * Math.sin(phase - cell.dist * 0.45);
          cls = 'z-' + cell.zone + '-' + Math.round(b * (STEPS - 1));
          ch = cell.glyph;
        }
        if (cls !== runCls) { flush(); runCls = cls; }
        run += ch;
      }
      flush();
      lines.push(html);
    }
    pre.innerHTML = lines.join('\n');
  }

  // ---- 驱动：?t=ms 冻结单帧（截图用）；否则循环到点按。
  // 纪律：任何一帧渲染抛错都不得清屏——停表保留静态兜底帧 ----
  var qs = /[?&]t=(\d+)/.exec(location.search);
  if (qs) { frame(+qs[1]); return; }
  var t0 = performance.now(), last = 0, dead = false;
  var splash = document.getElementById('nz-splash');
  function tick(now) {
    if (dead) return;
    if (now - last >= TICK) {
      last = now;
      try { frame(now - t0); } catch (e) { dead = true; return; }
    }
    if (!splash.classList.contains('out')) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  splash.addEventListener('click', function () { splash.classList.add('out'); });
})();
</script>
</body>
</html>
