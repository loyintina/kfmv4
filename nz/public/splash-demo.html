<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深蓝意志 · splash demo v14f</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  /* 覆层样式唯一真源=splash-core.js（ensureStyle 注入），此处不重复 */
</style>
</head>
<body>
<!--
  深蓝意志开屏 demo —— 薄壳。动画本体唯一真源 = ./splash-core.js
  （正式覆层同一文件；改动画=改 splash-core.js，两边同时生效）。
  演化拍板记录见 TASK 2026-08-30 条目。
  用法：直接打开=完整动画（刷新重播）；?t=<绝对毫秒>=冻结单帧（截图用，
  含 1s 延迟——如会师=2375、点火=2500）。
-->
<div id="nz-splash"><div class="beam beam-outer" id="beamO"></div><div class="beam beam-outer" id="beamO2"></div><div class="beam beam-inner" id="beamI"></div><pre id="art"><span class="st-cyan">    █
   █ █
  █   █
 █     █
█   █   █
 █     █
  █   █
   █ █
    █</span></pre></div>
<script src="./splash-core.js"></script>
<script>
(function () {
  var handle = window.NzSplashCore.create({
    splash: document.getElementById('nz-splash'),
    art: document.getElementById('art'),
    beamO: document.getElementById('beamO'),
    beamO2: document.getElementById('beamO2'),
    beamI: document.getElementById('beamI'),
  });
  // ?t=ms 冻结单帧（自验收截图用）；否则完整播放
  var qs = /[?&]t=(\d+)/.exec(location.search);
  if (qs) {
    document.getElementById('nz-splash').classList.add('on');
    handle.render(+qs[1]);
    return;
  }
  handle.show();
})();
</script>
</body>
</html>
