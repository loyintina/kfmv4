<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Kalo File Manager</title>
<link rel="stylesheet" href="css/base.css?v=93a5c697e2">
<link rel="stylesheet" href="css/sidebar.css?v=93a5c697e2">
<link rel="stylesheet" href="css/xterm.css?v=93a5c697e2">
<link rel="stylesheet" href="css/tmux-card.css?v=93a5c697e2">
<link rel="stylesheet" href="css/z-index.css?v=93a5c697e2">
</head>
<body>
<div class="sidebar" id="sidebar" data-registry-id="sidebar">
<div class="sidebar-content" id="fileTree"><div class="loading">加载中...</div></div>
<div class="sidebar-tools">
<button id="toggleHiddenBtn" data-registry-id="eye-btn" title="显示隐藏文件">
  <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
    <path d="M1 12s4-7.5 11-7.5 11 7.5 11 7.5-4 7.5-11 7.5-11-7.5-11-7.5z" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="2.5" fill="url(#iconGrad)"/>
    <defs>
      <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#00d4ff"/>
      </linearGradient>
    </defs>
  </svg>
</button>
<canvas id="siblingSwitcherBtn" style="flex:1;min-width:0;height:40px;display:block;cursor:pointer"></canvas>
<button id="closeSidebarBtn" class="sidebar-close-btn" data-registry-id="close-sidebar-btn" title="关闭侧栏"><span></span><span></span></button>
</div>
</div>
<div class="overlay" id="overlay" data-registry-id="overlay"></div>

<main class="main" id="main">
<div class="home-page" id="homePage">
</div>
</main>
<!-- AI对话输入栏 -->
<div class="ai-input-bar" id="aiInputBar">
  <textarea class="ai-input" rows="1" id="aiInput" data-registry-id="input-bar" placeholder="输入消息..."></textarea>
<button class="ai-send-btn" id="aiSendBtn" data-registry-id="ai-send-btn" title="发送">
  <svg class="send-icon-play" width="18" height="18" viewBox="0 0 18 18" fill="none">
    <polygon points="5,3 16,9 5,15" fill="white"/>
  </svg>
  <svg class="send-icon-pause" width="18" height="18" viewBox="0 0 18 18" fill="none">
    <rect x="4" y="3" width="3.5" height="12" rx="1" fill="white"/>
    <rect x="10.5" y="3" width="3.5" height="12" rx="1" fill="white"/>
  </svg>
</button>
</div>

<div class="light-orb" id="lightOrb" data-registry-id="orb"></div>

<div class="operation-toast" id="operationToast"></div>

<script src="bundle.js?v=93a5c697e2"></script>
</body>
</html>
