id: pre-code-gate
name: 改代码前约束加载
trigger: 准备修改 src/ 下任何文件
frequency: 每次改代码
reads:
  - constraints/invariants.md（自查清单 §六 + 相关心法节）
  - domains/{受影响域}/contract.md（架构 + #陷阱 + 文件清单）
steps:
  1. 定位改动所属域（client-shell/canvas-tree/floating-card/ai-chat/server/infra）
  2. 读该域 contract.md 全文（<150 行）
  3. 读 invariants.md §六 自查清单，逐条过
  4. 涉及注释时读 invariants.md §九 设计注释规约
writes: []
exit_condition: 能说出该域契约与相关陷阱，再动手
natural_next: 改动完成 → state-sync
metric: none
