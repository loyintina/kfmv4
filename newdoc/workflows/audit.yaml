id: audit
name: 文档-代码审计
trigger: 周期性（约两月）/ 感觉漂移时
frequency: 约两月一次（历史：06-02 → 07-28）
reads:
  - guides/doc-maintenance.md（审计节）
  - check 管线输出
steps:
  1. 跑全量 check，收集漂移信号
  2. 逐域核对 contract 与代码实际状态
  3. 修正文档或代码（谁错改谁，证据优先）
  4. 发现的系统性问题 → discipline-mechanize
writes:
  - domains/、guides/（修正）
  - check-*.mjs（如机械化）
exit_condition: 全量 check 绿 + 漂移清零
natural_next: discipline-mechanize（审计盛产机械化素材）
metric: ≥60 天未审计 → 候选提醒（铺路字段，未实现）
