# 新工作流模板 — 同一类 ad-hoc 操作重复 3 次后，复制本模板固化
id: <kebab-case>
name: <中文名>
trigger: <什么情况下进入本工作流>
frequency: <估计频率，供退役判断>
reads:        # 开始前要读什么（写文档全路径#节）
  - <路径>
steps:        # 步骤，每步可验证
  1. <步骤>
writes:       # 会写哪些文件（产出物的"家"由此定义）
  - <路径>
exit_condition: <什么状态算做完>
natural_next: <完成后自然衔接什么——提醒不强制，扳机在人>
metric: <度量触发器（铺路字段，暂未实现）；无则填 none>
