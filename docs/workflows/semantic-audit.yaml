id: semantic-audit
name: 语义审计（文档系统语义对账）
trigger: 大迁移/大重构后必跑；中版本收尾前例行
frequency: 迁移后 + 每中版本一次
reads:
  - active/semantic-compiler-seed.md
  - ledger/semantic-provenance.md
  - ledger/drift-provenance.md
steps:
  1. 机械先行：check 链全绿才进语义层——机械能抓的不进语义清单
  2. 脚本化审计（首选）：node scripts/agent/semantic-audit.mjs——探针集群（组内 17 + 组间 6，
     任务清单 scripts/agent/semantic-audit.tasks.mjs）并发对账 + 机械复核 + 增量跳过；
     产 SEM 清单草案。深潜/存疑分流可补手动 subagent
  3. 提示词必含「登记豁免规则」：已在 ledger 登记的漂移不算新发现（脚本已内置；
     手动审计时手动带上——v8.3 试点：加规则后重复立案归零）
  4. SEM 立案 → git 考古溯源（写入 commit / 失效 commit / 时间差 / G 成因分类）
  5. 修复轮：修复 + 同步全部引用面；修复必须带预防——能机械化的当场机械化，不能的登记豁免
  6. 复盘：成因分类学更新 + 提示词有效性数据（精确率/重复率）回写 semantic-provenance.md
writes:
  - ledger/semantic-provenance.md
  - ledger/bugs.md
exit_condition: 发现清零或全部立案分流 + 机械三件套绿 + 溯源账本回写
natural_next: contract-maintain
metric: 审计精确率（真发现/总报告）+ 重复立案率（登记豁免规则效果）
