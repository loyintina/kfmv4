id: semantic-audit
name: 语义审计（文档系统语义对账）
trigger: 大迁移/大重构后必跑；中版本收尾前例行
frequency: 迁移后 + 每中版本一次
reads:
  - active/semantic-compiler-seed.md
  - ledger/semantic-provenance.md
  - ledger/drift-provenance.md
steps:
  1. 机械先行：check 链全绿才进语义层——机械能抓的不进语义清单
  2. 脚本化审计（首选）：node scripts/agent/semantic-audit.mjs——探针集群（组内 18 + 组间 6，
     任务清单 scripts/agent/semantic-audit.tasks.mjs）并发对账 + 机械复核 + 增量跳过；
     产 SEM 清单草案。深潜/存疑分流可补手动 subagent
  3. 提示词必含「登记豁免规则」：已在 ledger 登记的漂移不算新发现（脚本已内置；
     手动审计时手动带上——v8.3 试点：加规则后重复立案归零）
  4. SEM 立案 → git 考古溯源（写入 commit / 失效 commit / 时间差 / G 成因分类）
  4.5. **变体登记（2026-08-02 加，两层码表定稿）**：SEM900 复发 ≥2 条 → 提案变体
     （SEMxxx-Y）→ 本裁决流确认 → 登记 ledger/semantic-variants.md（变体码/核心码/
     具现形态/first-seen/判例引用）；同变体计数 ≥3 → 结晶回路提案机械化规则（进确定区）。
     模型只做候选分组，立码必经本步拍板
  5. 修复轮：修复 + 同步全部引用面；修复必须带预防——能机械化的当场机械化，不能的登记豁免。
     **修复必须当场验证 + 当场提交（2026-08-05 硬规则，8-04 欠账教训）**：单跑受影响探针
     `--task=<id>` 确认清零才算出账；只记 provenance 不改文件 = 裁决未完成，下轮同款复发
     （8-04 曾记录「4/9/16 补 ✅」却未落盘 → 8-05 哈希未变同款复发）
  6. 裁决落账（2026-07-30 巡逻首跑追加）：修复裁决靠哈希变化下轮自动消除；
     **豁免裁决必须当场 `node scripts/agent/semantic-audit.mjs --task=<探针id>` 单跑该探针**
     （--task 点名必跑，prompt 含豁免 → keptFindings 刷新），否则旧发现在 state 里
     滞留成僵尸、信箱 ⚠️ 数字永不降（修复/豁免对称性条款）。
     **豁免登记（2026-08-02 加）：裁决确认的豁免写入 docs/ledger/semantic-exemptions.md**
     （EX-xx 表：目标/类型/理由/目标哈希；临时豁免必填 review-by）——探针读取跳过、
     巡逻做哈希失效与到期复核提醒（豁免不是永久静默）
  7. 复盘：成因分类学更新 + 提示词有效性数据（精确率/重复率）回写 semantic-provenance.md
writes:
  - ledger/semantic-provenance.md
  - ledger/bugs.md
exit_condition: 发现清零或全部立案分流 + npm run check 绿 + 溯源账本回写
natural_next: contract-maintain
metric: 审计精确率（真发现/总报告）+ 重复立案率（登记豁免规则效果）
