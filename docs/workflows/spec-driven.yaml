id: spec-driven
name: 大改动 spec-driven 流程
trigger: 跨 3+ 文件 / 多阶段 / 引入隐式契约的改动
frequency: 每周 1-2 次
reads:
  - guides/spec-driven.md（SOP 正文：步骤 1-7，含 3a 心法回溯 / 3b 设计讨论 / 沉淀五问）
  - active/眼睛与手.md（8.7 眼睛与手重构设计文档，spec-driven 临时产物——完成后删除并同步移除本行）
  - active/nine-zero/nine-zero-preface.md（9.0 会前酝酿——大重构的前置输入，转正后移入 9.0 设计地图）
  - active/nine-zero/nine-zero-capability-review.md（9.0 台账审查 + dsh 能力地图——采用决策配套材料）
  - active/nine-zero/nine-zero-cordis-vendor-18-eval.md（dsh 18 条强化移植评估——采用裁决 2 落地件）
  - active/nine-zero/nine-zero-implicit-globals-audit.md（隐式全局普查——采用裁决 5 步 0 材料）
  - active/nine-zero/nine-zero-semantic-map-cordis-side.md（三方语义映射表 Cordis 侧——降生协议附表材料）
  - active/nine-zero/nine-zero-infra-inventory.md（第二阶段基线盘点——基建层六族台账）
  - active/nine-zero/nine-zero-phase2-contracts.md（第二阶段契约 0-9 全文——基建层插件化定稿）
  - active/nine-zero/00-index.md（9.0 文档地图入口——「找什么→去哪」，设计前必读）
  - active/nine-zero/nine-zero-phase1-contracts.md（第一阶段契约 №1~№16 全文——运行时插件化定稿）
  - active/nine-zero/nine-zero-decision-index.md（9.0 决策索引——裁决史一张表，查「为什么这么定」）
  - active/nine-zero/nine-zero-semantic-map.md（三方语义映射拼接视图——降生协议附表）
  - active/nine-zero/nine-zero-semantic-map-cordis-na-side.md（三方语义映射 cordis-na 侧——NA 维护半）
  - ledger/agent-inbox/README.md（跨线评审信箱——9.0 评审往来与裁决状态列在此，设计前必读）
  - active/stack.yaml（当前工作栈）
  - constraints/invariants.md §二（心法表，步骤 3a/3b 的回溯对象）
steps:
  1. 需求提出 → 现状分析 → 设计确认（暴露所有已知缺口 + 5 场景压力测试）
  2. 设计文档写入 active/（含被否定方案及原因）
  3. 改动计划 → 实施 → 验证 → 沉淀五问
  4. 完成后：确认知识写入对应 domain contract + ledger/history.md 记一条，设计文档删除，STACK pop
writes:
  - active/*.md（设计文档，临时）
  - domains/{域}/contract.md（完成后的知识归宿）
exit_condition: 设计经压力测试 + 用户确认 + npm run check 绿 + 完成后知识被 contract 吸收
natural_next: feat 实施窗口 — 预期 fix 尾随（历史 47%），预留批次修复窗口
metric: none
