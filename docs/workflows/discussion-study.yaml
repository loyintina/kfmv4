id: discussion-study
name: 范式级讨论研究（人+agent 设计讨论 + 思维记录）
trigger: 与人进行范式级设计讨论——产生新机制/新框架/改变认知的讨论
  （如：文档价值判据、错误码体系、自我修正回路、意图=工作流等）
frequency: 低频（每次大讨论）
cost_warning: 不是所有对话都是范式级——日常问答/修 bug 不触发，避免记录噪音。
  判断：讨论是否改变了认知框架或产出了跨模块的设计决策？
reads:
  - 当前主题相关文档（按需）
  - active/thinking-patterns.md（历史模式参考——讨论中识别模式时对照）
steps:
  1. 自由讨论（类比/追问/反驳/统一——思维不设限，模式不预设）
  2. 讨论中保持「模式意识」：识别这次用到的思维模式
     （类比驱动/追问本质/找反例/概念统一/分层治理/数据先行/元层思考——类型见
     active/thinking-patterns.md，随时补充新类型）
  3. 收尾沉淀成果：设计决策 → decisions/ 或对应文档（ADR/契约/设计文档/工作流）
  4. 收尾记录思维：.kfmv4/ledger/discussion-log.jsonl 追加一条
     {ts, topic, trigger, jumps, patterns[], sinks, userConfirmed}
  5. 请用户确认模式标签（模式识别不能 agent 单方面定义——用户确认才入档）
  6. 新模式/新样本 → 更新 active/thinking-patterns.md（模式名 + 定义 + 出处）
writes:
  - 决策文档（decisions/ 或对应文档）
  - ~/.kfmv4/ledger/discussion-log.jsonl（原始数据账本，数据目录在仓库外）
  - active/thinking-patterns.md（模式+出处提炼）
exit_condition: 成果已沉淀 + 账本已记 + 用户已确认模式 + patterns.md 已更新
natural_next: 按成果类型走 doc-write / spec-driven / contract-maintain
metric: 模式频率分布（账本累积后统计——哪些模式高频、哪些带来好决策）

## 提醒机制（双路径）

- **主动路径**：agent 在讨论中意识到「自己在 discussion-study 工作流里」
  （范式级信号：用户在追问本质/提出新框架/推翻前提）→ 收尾时主动提议
  「这条值得记录，复盘一下？」
- **被动路径**：用户提出「复盘/记录一下」→ agent 对照本工作流回放讨论，
  识别模式节点，提议记录内容 + 模式标签，用户确认后入档。
- 两条路径都产出：成果沉淀 + 账本记录 + 模式文档更新。
