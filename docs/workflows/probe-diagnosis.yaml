# LLM 管线病灶排查 SOP — 蒸馏自 2026-07-30 MID-4 根因三轮错判与四臂实验定案
id: probe-diagnosis
name: LLM 管线病灶排查
trigger: LLM 管线（探针/审计/runner-agent）行为异常且根因不明——尤其是「换 prompt 没用」类
frequency: 按需（历史：语义审计调优期密集出现）
reads:
  - constraints/invariants.md §二 #32 测量优先、#33 实验优先
  - active/semantic-compiler-seed.md（双区管线与概率区纪律）
steps:
  1. 修尺：先证明检测工具能报病——探针夹具报红、变异基准对分、exit code 通路验证。
     没校准过的尺量出的结论一律不采信（MID-2 锚点冤案 / exit 0 吞码钩子）
  2. 定标噪声：单样本波动多大先量出来（±1？±2？），成绩在噪声带内不动 prompt。
     LLM 病灶是概率分布偏移，不是确定性重现
  3. 假设因子化：把「我觉得是因为 X」拆成可独立开关的因子（臂），每个因子给一条可证伪预测
     ——三轮纯推导全错的教训：跨账本/注意力稀释/保守文化，全是听起来合理的叙事
  4. 足样本对照：每臂 ≥5 样本再谈结论；臂间无差异本身就是结论（系统性因子被否决）
  5. 分层处置：定案后按性质归位——枚举型矛盾移民确定区（机械化），概率型留语义层，
     超出模型链能力的任务换推理者（深扫区先例）而不是死磕 prompt
writes:
  - 实验数据与结论 → 所属工作项的 STACK 条目
  - 反复出现的病灶家族 → discipline-mechanize（机械化移民）
exit_condition: 根因有实验数据支撑 + 处置归位（确定区/概率区/深扫区/换任务形式四选一）
natural_next: discipline-mechanize（枚举型病灶）；deep-scan（任务形式错配嫌疑）
metric: none
notes:
  - 排查工具是实验设计不是断点——LLM 没有确定的执行路径可断
  - 「我认为原因是……」出口前必问：存不存在一天内能跑出答案的实验？存在就先跑（心法 33）
  - 与 deep-scan 的分工：本 SOP 治「管线为什么不准」，deep-scan 治「文档哪里有矛盾」
