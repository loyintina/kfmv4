id: release
name: 版本发布
trigger: 发版候选（批次攒够 / 用户决定）
frequency: 约每 150 提交一版（历史 11 版/1656 提交）
reads:
  - guides/release.md
steps:
  1. 更新 package.json version
  2. ledger/history.md 加版本条目（粗体 **vX.Y.Z**）
  3. git commit "release: vX.Y.Z — 一句话"
  4. git tag vX.Y.Z
  5. npm run check 全绿（check-versions 验 tag+条目+标记一致）
writes:
  - package.json
  - ledger/history.md
  - git tag
exit_condition: check-versions 绿 + tag 存在
natural_next: 真机回归窗口开启 — fix 高发期（历史：发版窗口 fix 主导），可主动 smoke；窗口关闭回常态
metric: 已实现——check-release-radar：距上个 tag ≥30 提交或 ≥10 feat → WARN 提醒（阈值拟合历史窗口中位数 ~34 提交，只提醒不中断）
