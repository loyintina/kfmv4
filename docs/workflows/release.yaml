id: release
name: 版本发布
trigger: 发版候选（批次攒够 / 用户决定）
frequency: 约每 40-50 提交一版（阈值拟合历史窗口中位数，见 check-release-radar）
reads:
  - guides/release.md
steps:
  0. **入口文档体检**（2026-08-02 加）：`node experiments/coldstart/tools/routine-entry-validation.mjs --arms 3`
     跑 kfmdocs-only 验证臂对照基线，臂数如命令所示（实况单源 = crontab 巡逻同口径）；
     FAIL（判定阈值单源 = 脚本内 THRESHOLDS 常量——2026-08-02 池化校准后随脚本演进，
     数字一律不复述到文档，会漂）
     → 先修文档再发版（v1.1 式修复轮）；PASS 继续
  1. 更新 package.json version
  2. ledger/history.md 加版本条目（`- vX.Y.Z` 行）
  3. git commit "release: vX.Y.Z — 一句话"
  4. git tag vX.Y.Z
  5. npm run check 全绿（check-versions 验 tag+条目+标记一致）
writes:
  - package.json
  - ledger/history.md
  - git tag
exit_condition: 步骤 0 入口体检 PASS + npm run check 全绿（check-versions 验 tag+条目+标记一致）+ tag 存在
natural_next: 真机回归窗口开启 — fix 高发期（历史：发版窗口 fix 主导），可主动 smoke；窗口关闭回常态
metric: 已实现——check-release-radar：距上个 tag ≥30 提交或 ≥10 feat → WARN 提醒（阈值拟合历史窗口中位数 ~34 提交，只提醒不中断）
